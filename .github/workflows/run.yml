name: Create OCI Instance

on:
  workflow_dispatch:

jobs:
  run-script:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check Secrets Formatting
        env:
          TENANCY: ${{ secrets.OCI_TENANCY_ID }}
          USER: ${{ secrets.OCI_USER_ID }}
          FINGERPRINT: ${{ secrets.OCI_FINGERPRINT }}
          REGION: ${{ secrets.OCI_REGION }}
        run: |
          echo "=== Vérification des formats ==="
          echo "Tenancy débute par : ${TENANCY:0:15} (longueur: ${#TENANCY})"
          echo "User débute par : ${USER:0:15} (longueur: ${#USER})"
          echo "Fingerprint : '$FINGERPRINT'"
          echo "Region : '$REGION'"
          if [[ "$TENANCY" == *"/"* ]] || [[ "$USER" == *"/"* ]] || [[ "$FINGERPRINT" == *"/"* ]]; then
            echo "❌ ERREUR DÉTECTÉE : Un slash '/' est présent dans l'un de ces trois secrets !"
            exit 1
          fi

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Write private key file
        env:
          RAW_KEY: ${{ secrets.OCI_PRIVATE_KEY }}
        run: |
          printf "%s\n" "$RAW_KEY" > /tmp/oci_api_key.pem
          chmod 600 /tmp/oci_api_key.pem

      - name: Run instance creator
        env:
          OCI_USER_ID: ${{ secrets.OCI_USER_ID }}
          OCI_TENANCY_ID: ${{ secrets.OCI_TENANCY_ID }}
          OCI_KEY_FINGERPRINT: ${{ secrets.OCI_FINGERPRINT }}
          OCI_REGION: ${{ secrets.OCI_REGION }}
          OCI_SUBNET_ID: ${{ secrets.OCI_SUBNET_ID }}
          OCI_IMAGE_ID: ${{ secrets.OCI_IMAGE_ID }}
          OCI_SSH_PUBLIC_KEY: ${{ secrets.OCI_SSH_PUBLIC_KEY }}
          OCI_PRIVATE_KEY_FILENAME: /tmp/oci_api_key.pem
        run: php index.php
