name: Create OCI Instance

on:
  workflow_dispatch:
  schedule:
    - cron: '*/10 * * * *'

jobs:
  create-instance:
    runs-on: ubuntu-latest

    steps:
      - name: Install OCI CLI
        run: |
          set -e

          curl -L https://raw.githubusercontent.com/oracle/oci-cli/master/scripts/install/install.sh -o install.sh
          chmod +x install.sh

          ./install.sh \
            --accept-all-defaults \
            --exec-dir "$HOME/bin" \
            --install-dir "$HOME/lib/oracle-cli"

          echo "$HOME/bin" >> "$GITHUB_PATH"

          "$HOME/bin/oci" --version

      - name: Configure OCI Credentials
        env:
          USER_ID: ${{ secrets.OCI_USER_ID }}
          TENANCY_ID: ${{ secrets.OCI_TENANCY_ID }}
          FINGERPRINT: ${{ secrets.OCI_KEY_FINGERPRINT }}
          REGION: ${{ secrets.OCI_REGION }}
          KEY_CONTENT: ${{ secrets.OCI_PRIVATE_KEY }}
        run: |
          set -e

          mkdir -p "$HOME/.oci"

          printf "%s\n" "$KEY_CONTENT" > "$HOME/.oci/oci_api_key.pem"
          chmod 600 "$HOME/.oci/oci_api_key.pem"

          cat > "$HOME/.oci/config" <<EOF
          [DEFAULT]
          user=${USER_ID//[[:space:]]/}
          fingerprint=${FINGERPRINT//[[:space:]]/}
          key_file=$HOME/.oci/oci_api_key.pem
          tenancy=${TENANCY_ID//[[:space:]]/}
          region=${REGION//[[:space:]]/}
          EOF

          "$HOME/bin/oci" iam region list --query "data[0].name" --raw-output

      - name: Attempt Instance Launch
        env:
          SUBNET_ID: ${{ secrets.OCI_SUBNET_ID }}
          IMAGE_ID: ${{ secrets.OCI_IMAGE_ID }}
          SSH_KEY: ${{ secrets.OCI_SSH_PUBLIC_KEY }}
          TENANCY_ID: ${{ secrets.OCI_TENANCY_ID }}
        run: |
          set -e

          OCI="$HOME/bin/oci"

          AD=$("$OCI" iam availability-domain list \
            --compartment-id "${TENANCY_ID//[[:space:]]/}" \
            --query "data[0].name" \
            --raw-output)

          echo "Disponibilité ciblée : $AD"

          echo "Tentative de création de la VM ARM..."

          "$OCI" compute instance launch \
            --availability-domain "$AD" \
            --compartment-id "${TENANCY_ID//[[:space:]]/}" \
            --shape "VM.Standard.A1.Flex" \
            --shape-config '{"ocpus": 2, "memoryInGBs": 12}' \
            --display-name "Minecraft-Server" \
            --image-id "${IMAGE_ID//[[:space:]]/}" \
            --subnet-id "${SUBNET_ID//[[:space:]]/}" \
            --assign-public-ip true \
            --ssh-authorized-keys "$SSH_KEY"
